<!DOCTYPE html>
<html>
<head>
  <title>Shivam CU - Main Menu</title>
  <style>
    body { font-family: Tahoma, sans-serif; background: #c0c0c0; margin: 0; }
    .header { background: #003366; color: white; padding: 8px 16px; font-size: 14px; }
    .nav { background: #d4d0c8; border-bottom: 1px solid #808080; padding: 4px 8px; font-size: 12px; }
    .nav a { margin-right: 16px; color: #000080; text-decoration: underline; cursor: pointer; }
    .content { padding: 16px; }
    table.menu { border-collapse: collapse; }
    table.menu td { padding: 8px 24px; background: #f0f0f0; border: 1px solid #808080; cursor: pointer; font-size: 13px; }
    table.menu td:hover { background: #ffffcc; }
    iframe { width: 100%; height: 500px; border: 1px inset #808080; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="header">Shivam Credit Union &mdash; Back Office System v2.4.1</div>
  <div class="nav">
    <a onclick="showFrame('member-lookup')">Member Lookup</a>
    <a onclick="showFrame('sub-account')">New Sub-Account</a>
    <a onclick="window.location.href='/login.html'">Sign Out</a>
  </div>
  <div class="content">
    <p style="font-size:13px;">Welcome, Operator. Select a function from the menu below.</p>
    <table class="menu">
      <tr>
        <td onclick="showFrame('member-lookup')">Member Account Inquiry</td>
        <td onclick="showFrame('sub-account')">Open New Sub-Account</td>
      </tr>
    </table>
    <iframe id="workframe" name="workframe"></iframe>
  </div>
  <script>
    function showFrame(page) {
      const frame = document.getElementById('workframe');
      frame.style.display = 'block';
      frame.src = '/' + page + '.html';
    }
  </script>
</body>
</html>
